services:
  postgres:
    image: postgres:18
    container_name: aviator-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: aviator
      POSTGRES_USER: aviator
      POSTGRES_PASSWORD: aviator_password

    ports:
      - "5434:5432"

    volumes:
      - aviator_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviator -d aviator"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: dockerfile
    command: ["./aviator-migrate"]
    environment:
      DATABASE_URL: postgres://aviator:aviator_password@postgres:5432/aviator?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: aviator-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://aviator:aviator_password@postgres:5432/aviator?sslmode=disable
      APP_PORT: "7000"
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      HOUSE_EDGE: ${HOUSE_EDGE:-0}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      BETTING_WINDOW_SECONDS: ${BETTING_WINDOW_SECONDS:-5}
      MULTIPLIER_GROWTH_RATE: ${MULTIPLIER_GROWTH_RATE:-0.08}
      MIN_BET_AMOUNT: ${MIN_BET_AMOUNT:-50}
      MAX_BET_AMOUNT: ${MAX_BET_AMOUNT:-1000000}
      MAX_PAYOUT: ${MAX_PAYOUT:-100000000}
      MIN_DEPOSIT_AMOUNT: ${MIN_DEPOSIT_AMOUNT:-1}
      MAX_DEPOSIT_AMOUNT: ${MAX_DEPOSIT_AMOUNT:-10000000}
      MIN_WITHDRAWAL_AMOUNT: ${MIN_WITHDRAWAL_AMOUNT:-1}
      MAX_WITHDRAWAL_AMOUNT: ${MAX_WITHDRAWAL_AMOUNT:-10000000}

    ports:
      - "7000:7000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../Aviator-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  aviator_postgres_data:

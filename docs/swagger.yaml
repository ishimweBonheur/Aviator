basePath: /
definitions:
  admin.AdjustmentRequest:
    properties:
      amount:
        type: string
      direction:
        type: string
      reason:
        type: string
      reference:
        type: string
    type: object
  admin.AnalyticsResponse:
    properties:
      active_players:
        type: integer
      bet_count:
        type: integer
      daily:
        items:
          $ref: '#/definitions/admin.DailyMetrics'
        type: array
      deposits:
        example: "120000.00"
        type: string
      ggr:
        example: "6000.00"
        type: string
      house_margin_percent:
        example: "6.00"
        type: string
      rtp_percent:
        example: "94.00"
        type: string
      total_payouts:
        example: "94000.00"
        type: string
      total_wagered:
        example: "100000.00"
        type: string
      withdrawals:
        example: "30000.00"
        type: string
    type: object
  admin.DailyMetrics:
    properties:
      active_players:
        type: integer
      bet_count:
        type: integer
      day:
        example: "2026-09-26"
        type: string
      deposits:
        type: string
      ggr:
        example: "6000.00"
        type: string
      payouts:
        example: "94000.00"
        type: string
      rtp_percent:
        example: "94.00"
        type: string
      wagered:
        example: "100000.00"
        type: string
      withdrawals:
        type: string
    type: object
  admin.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  admin.OverviewResponse:
    properties:
      active_bets:
        type: integer
      active_players:
        type: integer
      active_users:
        type: integer
      bet_count:
        type: integer
      deposits:
        type: string
      ggr:
        type: string
      house_margin_percent:
        type: string
      pending_deposits:
        type: integer
      pending_withdrawals:
        type: integer
      rtp_percent:
        type: string
      total_payouts:
        type: string
      total_player_balances:
        example: "450000.00"
        type: string
      total_users:
        type: integer
      total_wagered:
        type: string
      withdrawals:
        type: string
    type: object
  admin.Page:
    properties:
      items:
        items:
          additionalProperties: {}
          type: object
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  admin.StatusRequest:
    properties:
      reason:
        type: string
      status:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      error:
        example: invalid request body
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: bonheur@example.com
        type: string
      password:
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      token:
        example: JWT_TOKEN
        type: string
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: bonheur@example.com
        type: string
      password:
        example: password123
        minLength: 8
        type: string
      username:
        example: bonheur
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.User:
    properties:
      email:
        type: string
      id:
        format: int64
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  betting.CancelResult:
    properties:
      bet_id:
        type: integer
      refunded_amount:
        type: string
      remaining_balance:
        type: string
      status:
        type: string
    type: object
  betting.PlaceBetRequest:
    properties:
      amount:
        type: string
      bet_number:
        type: integer
      round_id:
        type: integer
    type: object
  cashout.CashoutResponse:
    properties:
      bet_amount:
        type: number
      bet_id:
        type: integer
      multiplier:
        type: number
      payout:
        type: number
      remaining_balance:
        type: number
    type: object
  deposit.CreateRequest:
    properties:
      amount:
        type: string
      provider:
        type: string
    type: object
  deposit.Deposit:
    properties:
      amount:
        type: number
      completed_at:
        type: string
      created_at:
        type: string
      id:
        type: integer
      provider:
        type: string
      provider_reference:
        type: string
      status:
        $ref: '#/definitions/deposit.Status'
      user_id:
        type: integer
    type: object
  deposit.Status:
    enum:
    - PENDING
    - PROCESSING
    - COMPLETED
    - FAILED
    - CANCELLED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusProcessing
    - StatusCompleted
    - StatusFailed
    - StatusCancelled
  game.GameRound:
    properties:
      betting_closes_at:
        type: string
      betting_opened_at:
        type: string
      client_seed:
        type: string
      crash_point:
        type: number
      created_at:
        type: string
      ended_at:
        type: string
      house_edge:
        type: number
      id:
        type: integer
      nonce:
        type: integer
      round_number:
        type: integer
      server_seed:
        type: string
      server_seed_hash:
        type: string
      started_at:
        type: string
      status:
        $ref: '#/definitions/game.RoundStatus'
    type: object
  game.RoundStatus:
    enum:
    - CREATED
    - BETTING_OPEN
    - BETTING_CLOSED
    - RUNNING
    - CRASHED
    - SETTLED
    type: string
    x-enum-varnames:
    - RoundCreated
    - RoundBettingOpen
    - RoundBettingClosed
    - RoundRunning
    - RoundCrashed
    - RoundSettled
  game.Snapshot:
    properties:
      current_multiplier:
        type: string
      running:
        $ref: '#/definitions/game.GameRound'
      server_time:
        type: string
      upcoming:
        $ref: '#/definitions/game.GameRound'
    type: object
  risk.Limits:
    properties:
      maxBet:
        type: number
      maxDeposit:
        type: number
      maxPayout:
        type: number
      maxWithdrawal:
        type: number
      minBet:
        type: number
      minDeposit:
        type: number
      minWithdrawal:
        type: number
    type: object
  settlement.Result:
    properties:
      alreadySettled:
        type: boolean
      lostBets:
        type: integer
      roundID:
        format: int64
        type: integer
    type: object
  wallet.BalanceResponse:
    properties:
      balance:
        example: "1000.00"
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  withdrawal.CreateRequest:
    properties:
      amount:
        type: string
      provider:
        type: string
    type: object
  withdrawal.CreateResult:
    properties:
      remaining_balance:
        type: number
      withdrawal:
        $ref: '#/definitions/withdrawal.Withdrawal'
    type: object
  withdrawal.Status:
    enum:
    - PENDING
    - PROCESSING
    - COMPLETED
    - FAILED
    - CANCELLED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusProcessing
    - StatusCompleted
    - StatusFailed
    - StatusCancelled
  withdrawal.Withdrawal:
    properties:
      amount:
        type: number
      completed_at:
        type: string
      created_at:
        type: string
      id:
        type: integer
      provider:
        type: string
      provider_reference:
        type: string
      status:
        $ref: '#/definitions/withdrawal.Status'
      user_id:
        type: integer
    type: object
host: localhost:7000
info:
  contact: {}
  description: HTTP API for the Aviator real-money game backend.
  title: Aviator Backend API
  version: "1.0"
paths:
  /api/admin/analytics:
    get:
      description: Requires an active ADMIN role. Analytics use settled rounds, exclude
        cancelled bets, and bucket days in UTC.
      parameters:
      - description: Inclusive RFC3339 timestamp
        in: query
        name: from
        type: string
      - description: Exclusive RFC3339 timestamp
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.AnalyticsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin Analytics
      tags:
      - admin
  /api/admin/bets:
    get:
      description: Requires ADMIN. Amounts are decimal strings. Rounds redact seeds
        until settlement and crash points until crash. Returns snapshot-consistent
        total and page, newest first.
